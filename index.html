<!DOCTYPE html>
<html>
<head>
    <title>Gemini Aviator Simulyatoru</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        #game-box { width: 600px; height: 400px; background: #000; margin: 20px auto; position: relative; border: 2px solid #ff003c; overflow: hidden; }
        #plane { position: absolute; bottom: 20px; left: 20px; font-size: 40px; transition: 0.1s; }
        #multiplier { font-size: 50px; margin-top: 150px; color: #ff003c; }
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 20px; background: #ff003c; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:disabled { background: #555; }
        #status { margin-top: 10px; font-size: 18px; color: #00ff00; }
    </style>
</head>
<body>
    <h1>Aviator Vizual Simulyasiya</h1>
    <div id="game-box">
        <div id="multiplier">1.00x</div>
        <div id="plane">🛫</div>
    </div>
    <div class="controls">
        <p>Balans: <span id="balance">100.00</span> AZN</p>
        <input type="number" id="bet" value="10" min="1">
        <button id="startBtn" onclick="startGame()">Mərc Et</button>
        <button id="cashOutBtn" onclick="cashOut()" disabled>Pulu Götür</button>
    </div>
    <p id="status"></p>

    <script>
        let balance = 100;
        let currentMultiplier = 1.00;
        let crashPoint = 0;
        let gameInterval;
        let isPlaying = false;

        function startGame() {
            let bet = parseFloat(document.getElementById('bet').value);
            if (bet > balance) { alert("Balans yetərli deyil!"); return; }
            
            isPlaying = true;
            balance -= bet;
            updateUI();
            
            currentMultiplier = 1.00;
            crashPoint = (Math.random() * 5 + 1).toFixed(2); // 1.00 ilə 6.00 arası təsadüfi
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('cashOutBtn').disabled = false;
            document.getElementById('status').innerText = "Təyyarə havaya qalxdı...";
            
            gameInterval = setInterval(() => {
                currentMultiplier += 0.01;
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";
                
                // Təyyarəni vizual olaraq yuxarı və sağa hərəkət etdiririk
                let plane = document.getElementById('plane');
                plane.style.left = (20 + (currentMultiplier - 1) * 50) + "px";
                plane.style.bottom = (20 + (currentMultiplier - 1) * 30) + "px";

                if (currentMultiplier >= crashPoint) {
                    gameOver(false);
                }
            }, 100);
        }

        function cashOut() {
            if (!isPlaying) return;
            let bet = parseFloat(document.getElementById('bet').value);
            let winAmount = bet * currentMultiplier;
            balance += winAmount;
            gameOver(true, winAmount);
        }

        function gameOver(win, amount = 0) {
            clearInterval(gameInterval);
            isPlaying = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('cashOutBtn').disabled = true;
            
            if (win) {
                document.getElementById('status').innerText = "UDDUNUZ! +" + amount.toFixed(2) + " AZN";
                document.getElementById('status').style.color = "#00ff00";
            } else {
                document.getElementById('status').innerText = "Təyyarə uçub getdi (Crash)!";
                document.getElementById('status').style.color = "#ff003c";
                document.getElementById('plane').innerText = "💥";
                setTimeout(() => { document.getElementById('plane').innerText = "🛫"; }, 2000);
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }
    </script>
</body>
</html>
