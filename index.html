<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky 3 Streak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background: #0a0000;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', system-ui;
        }
        
        .machine {
            max-width: 520px;
            margin: 20px auto;
            background: linear-gradient(180deg, #2c0000, #110000);
            border: 14px solid #ffaa00;
            border-radius: 20px;
            box-shadow: 0 0 60px #ff5500, inset 0 0 40px #ffaa00;
            overflow: hidden;
        }
        
        .header {
            background: #000;
            padding: 12px;
            text-align: center;
            border-bottom: 6px solid #ff5500;
        }
        
        .logo {
            font-size: 28px;
            color: #ffdd00;
            text-shadow: 0 0 20px #ff8800, 0 0 30px #ff0000;
            letter-spacing: 4px;
        }
        
        .reels-container {
            background: #1a0000;
            padding: 20px 15px;
            position: relative;
        }
        
        .flames {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, #ff8800, #ff2200);
            opacity: 0.7;
            z-index: 10;
            animation: fire 1.2s infinite alternate;
        }
        
        @keyframes fire {
            0% { transform: scaleY(0.9); }
            100% { transform: scaleY(1.1); }
        }
        
        .reel {
            width: 110px;
            height: 330px;
            background: #111;
            border: 8px solid #ffd700;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 30px #000;
            position: relative;
        }
        
        .strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.08s linear;
        }
        
        .symbol {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            background: #222;
            border-bottom: 4px solid #444;
            image-rendering: pixelated;
        }
        
        .symbol.bar {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(#555, #999);
            color: #111;
            text-shadow: 3px 3px 0 #000;
            letter-spacing: 2px;
        }
        
        .reel::after {
            content: '';
            position: absolute;
            top: 110px;
            left: 0;
            right: 0;
            height: 110px;
            border-top: 4px solid #ffdd00;
            border-bottom: 4px solid #ffdd00;
            box-shadow: 0 0 20px #ffdd00;
            pointer-events: none;
            z-index: 20;
        }
        
        .controls {
            background: #000;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        #spinBtn {
            width: 180px;
            height: 80px;
            background: radial-gradient(circle at 50% 30%, #ffff00, #ff8800);
            color: #000;
            font-size: 28px;
            font-weight: 900;
            border: 8px solid #fff;
            border-radius: 9999px;
            box-shadow: 0 0 40px #ffff00, 0 10px 0 #aa5500;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        #spinBtn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #aa5500;
        }
        
        .info-bar {
            background: #111;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            border-top: 4px solid #ff5500;
        }
        
        .win-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 80, 0.95);
            color: #000;
            padding: 8px 24px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 9999px;
            box-shadow: 0 0 30px #00ff80;
            white-space: nowrap;
            z-index: 30;
            animation: winPop 0.6s;
        }
        
        @keyframes winPop {
            0% { transform: translateX(-50%) scale(0.2); }
            70% { transform: translateX(-50%) scale(1.2); }
            100% { transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="machine mx-auto">
        <!-- Header -->
        <div class="header flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🔥</span>
                <div class="logo">LUCKY 3 STREAK</div>
            </div>
            <div class="flex gap-2">
                <button onclick="window.location.reload()" 
                        class="bg-gray-800 hover:bg-gray-700 px-5 py-2 rounded text-sm">GERİ</button>
            </div>
        </div>

        <!-- Reels -->
        <div class="reels-container" id="reelsContainer">
            <div class="flames"></div>
            <div class="flex justify-center gap-4" id="reels">
                <!-- JS ilə doldurulacaq -->
            </div>
        </div>

        <!-- Info -->
        <div class="info-bar text-yellow-300">
            <div>
                <span class="text-xs block text-gray-400">BAHİS</span>
                <span id="betAmount" class="text-2xl font-bold text-white">120</span>
            </div>
            <div class="text-center">
                <span class="text-xs block text-gray-400">ÇİZGİ</span>
                <span class="text-2xl font-bold text-white">5</span>
            </div>
            <div class="text-right">
                <span class="text-xs block text-gray-400">BAKİYE</span>
                <span id="balance" class="text-2xl font-bold text-white">999,970</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button onclick="changeBet(-10)" 
                    class="w-12 h-12 bg-red-600 hover:bg-red-700 rounded-full text-3xl font-bold text-white shadow-inner">−</button>
            
            <button id="spinBtn" onclick="startSpin()">
                <span class="text-4xl">▶</span>
                <span class="text-xl tracking-widest">FIRLAT</span>
            </button>
            
            <button onclick="changeBet(10)" 
                    class="w-12 h-12 bg-green-600 hover:bg-green-700 rounded-full text-3xl font-bold text-white shadow-inner">+</button>
        </div>

        <!-- Footer info -->
        <div class="info-bar text-xs text-gray-400 px-6 py-3 flex justify-between items-center">
            <div>JETON DƏYƏRİ <span class="text-white">$0.01</span></div>
            <div class="flex gap-4">
                <span onclick="alert('Auto spin gələcək versiyada!')" class="cursor-pointer">🔄</span>
                <span onclick="alert('Turbo mod gələcək versiyada!')" class="cursor-pointer">⚡</span>
            </div>
        </div>
    </div>

    <script>
        // Simvollar (şəkillərdəki kimi)
        const symbolTypes = [
            { type: 'BAR', html: `<div class="symbol bar">BAR</div>` },
            { type: 'GRAPE', html: `<div class="symbol">🍇</div>` },
            { type: 'GRAPE2', html: `<div class="symbol text-blue-300">🍇</div>` }
        ];

        let balance = 999970;
        let bet = 120;
        let isSpinning = false;

        const reelsDiv = document.getElementById('reels');
        const balanceEl = document.getElementById('balance');
        const betEl = document.getElementById('betAmount');

        // 3 reel yarat
        let reelStrips = [];
        
        function createReels() {
            reelsDiv.innerHTML = '';
            reelStrips = [];
            
            for (let i = 0; i < 3; i++) {
                const reel = document.createElement('div');
                reel.className = 'reel';
                
                const strip = document.createElement('div');
                strip.className = 'strip';
                
                // 40 simvollu uzun zolaq (fırlanma üçün)
                for (let j = 0; j < 40; j++) {
                    const randomSymbol = symbolTypes[Math.floor(Math.random() * symbolTypes.length)];
                    strip.innerHTML += randomSymbol.html;
                }
                
                reel.appendChild(strip);
                reelsDiv.appendChild(reel);
                reelStrips.push(strip);
            }
        }

        function changeBet(amount) {
            if (isSpinning) return;
            bet = Math.max(50, Math.min(500, bet + amount));
            betEl.textContent = bet;
        }

        async function startSpin() {
            if (isSpinning || balance < bet) {
                if (balance < bet) alert("Bakiyə kifayət deyil!");
                return;
            }
            
            isSpinning = true;
            balance -= bet;
            balanceEl.textContent = balance.toLocaleString('az-AZ');
            
            // Hər reel üçün fərqli sürət və dayanıq nöqtəsi
            const finalMiddleSymbols = [];
            
            for (let i = 0; i < 3; i++) {
                const strip = reelStrips[i];
                const reelElement = strip.parentElement;
                
                // Sürətli fırlanma
                const spinTime = 1800 + (i * 400); // birinci reel tez, sonuncu yavaş dayanır
                
                strip.style.transition = `transform ${spinTime}ms cubic-bezier(0.25, 0.1, 0.3, 1)`;
                
                // Çox fırlanma (tam dövrələr + random)
                const fullSpins = 12 + Math.floor(Math.random() * 8);
                const symbolHeight = 110;
                const randomStop = Math.floor(Math.random() * 12) * symbolHeight;
                const distance = fullSpins * (40 * symbolHeight) + randomStop;
                
                strip.style.transform = `translateY(-${distance}px)`;
                
                // Dayanma vaxtı gözlə
                await new Promise(resolve => setTimeout(resolve, spinTime + 50));
                
                // Tam dayanma (real simvollara yapışdır)
                strip.style.transition = 'none';
                const finalTypeIndex = Math.floor(Math.random() * symbolTypes.length);
                const finalSymbol = symbolTypes[finalTypeIndex];
                
                // Orta simvolu qeyd et (qazanma yoxlaması üçün)
                if (i === 0) finalMiddleSymbols[0] = finalSymbol.type;
                if (i === 1) finalMiddleSymbols[1] = finalSymbol.type;
                if (i === 2) finalMiddleSymbols[2] = finalSymbol.type;
                
                // Orta simvolu düzgün yerə gətir
                strip.style.transform = `translateY(-${(18 + finalTypeIndex) * symbolHeight}px)`;
            }
            
            // Qazanc yoxlaması
            setTimeout(() => {
                const win = checkWin(finalMiddleSymbols);
                if (win > 0) {
                    balance += win;
                    balanceEl.textContent = balance.toLocaleString('az-AZ');
                    
                    const winMsg = document.createElement('div');
                    winMsg.className = 'win-text';
                    winMsg.innerHTML = `🎉 40 ÖDƏR! +${win}`;
                    document.getElementById('reelsContainer').appendChild(winMsg);
                    
                    setTimeout(() => winMsg.remove(), 2800);
                }
                isSpinning = false;
            }, 800);
        }

        function checkWin(middles) {
            if (middles[0] === 'GRAPE' && middles[1] === 'GRAPE' && middles[2] === 'GRAPE') {
                return bet * 40; // screenshots-dakı kimi 40 ödər
            }
            if (middles[0] === 'BAR' && middles[1] === 'BAR' && middles[2] === 'BAR') {
                return bet * 20;
            }
            return 0;
        }

        // Başlanğıc
        createReels();
        balanceEl.textContent = balance.toLocaleString('az-AZ');
        betEl.textContent = bet;
        
        // Klaviatura ilə də işləsin (SPACE = fırlat)
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && !isSpinning) {
                e.preventDefault();
                startSpin();
            }
        });
    </script>
</body>
</html>
